[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcengine-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python PC Engine / TurboGrafx-16 board with documented sockets for add-ons"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.20); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
# The CPU core, huc6280-python, pinned by git commit (v0.1.0 on GitHub):
# a379416 = Release 0.1.0 over 1884f23 (issue 0002: an interrupt whose source vanished before
# entry is no longer entered through IRQ2), over 7f789e4 (block-transfer zero reads over
# $0800-$17FF, issue 0001), over 143eb29 (rungs 0-5, MAME-replayed 21.0M instructions with 0
# register divergences). Repin deliberately and rerun the gate (docs/m1-record.md).
dependencies = [
    "huc6280-python @ git+https://github.com/alewman/huc6280-python@a379416d9c753075200a28de2c40d30de18f04d0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # the PSG referee comparison (scripts/psg_compare.py, tests/test_psg_referees.py)
    "numpy",
    "Pillow",
    # Pinned: `ruff format --check` must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pcengine_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "tests/test_roms", "tests/mame_traces", "tests/runs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pcengine_python"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not slow'"
pythonpath = ["src", "tests"]
markers = [
    "slow: runs a test ROM or an oracle for many emulated seconds (pytest -m slow)",
    "needs_cpu: needs huc6280-python, pinned in pyproject once its rung 1 passes",
]
